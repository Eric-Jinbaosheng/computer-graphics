<body bgcolor=#80a0ff>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

// Function to normalize a 3D vector

let normalize = v => {
   let s = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
   return [v[0] / s, v[1] / s, v[2] / s];
}

// Number of cubes and light sources

const NC = 5;
const NL = 2;

function Scene() {

   // Vertex shader

   this.vertexShader = `#version 300 es
   in vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   // Fragment shader

   this.fragmentShader = `#version 300 es
   precision highp float;

   uniform float uTime;

   uniform vec4 uCG[` + NC + `];
   uniform vec3 uSA[` + NC + `];
   uniform vec3 uSD[` + NC + `];
   uniform vec4 uSS[` + NC + `];

   uniform vec3 uLG[` + NL + `];
   uniform vec3 uLC[` + NL + `];

   in vec3 vPos;
   out vec4 fragColor;

   float fl = 3.;

   // Trace a ray to a cube and return normal.xyz and t

   vec4 rayCube(vec3 V, vec3 W, vec4 C) {
      float r = C.w;

      vec4 P[6];
      P[0] = vec4(-1., 0., 0.,  C.x - r);
      P[1] = vec4( 1., 0., 0., -C.x - r);
      P[2] = vec4(0., -1., 0.,  C.y - r);
      P[3] = vec4(0.,  1., 0., -C.y - r);
      P[4] = vec4(0., 0., -1.,  C.z - r);
      P[5] = vec4(0., 0.,  1., -C.z - r);

      float t0 = -1000.;
      float t1 = 1000.;
      vec3 N = vec3(0.);

      for (int i = 0 ; i < 6 ; i++) {
         float vd = dot(vec4(V,1.), P[i]);
         float wd = dot(W, P[i].xyz);

         if (abs(wd) < .0001) {
            if (vd > 0.) return vec4(0.,0.,0.,-1.);
         }
         else {
            float t = -vd / wd;

            if (wd < 0.) {
               if (t > t0) {
                  t0 = t;
                  N = P[i].xyz;
               }
            }
            else
               t1 = min(t1, t);
         }
      }

      if (t0 < t1 && t0 >= 0.) return vec4(N,t0);
      return vec4(0.,0.,0.,-1.);
   }

   void main() {

      fragColor = vec4(0.);

      // Ray from camera to pixel

      vec3 V = vec3(0.);
      vec3 W = normalize(vec3(vPos.xy, -fl));

      // Find nearest cube

      float tMin = 1000.;

      for (int i = 0 ; i < ` + NC + ` ; i++) {
         vec4 hit = rayCube(V, W, uCG[i]);
         float t = hit.w;

         if (t >= 0. && t < tMin) {
            tMin = t;

            vec3 P = V + t * W;
            vec3 N = hit.xyz;

            // Ambient light

            vec3 c = uSA[i];

            // Diffuse and specular light

            for (int j = 0 ; j < ` + NL + ` ; j++) {
               vec3 L = uLG[j];
               vec3 R = 2. * dot(N,L) * N - L;

               vec3 cj = .8 * max(0.,dot(N,L)) * uSD[i] * uLC[j]
                       + pow(max(0.,dot(-W,R)),uSS[i].a) * uSS[i].rgb * uLC[j];

               // Shadow

               vec3 Ws = L;
               vec3 Vs = P + .001 * L;

               for (int k = 0 ; k < ` + NC + ` ; k++)
                  if (rayCube(Vs, Ws, uCG[k]).w > 0.)
                     cj = vec3(0.);

               c += cj;
            }

            // Reflection

            vec3 cr = vec3(0.);
            vec3 Wr = W - 2. * dot(N,W) * N;
            vec3 Vr = P + .001 * Wr;

            float trMin = 1000.;

            for (int k = 0 ; k < ` + NC + ` ; k++) {
               vec4 hit2 = rayCube(Vr, Wr, uCG[k]);
               float tr = hit2.w;

               if (tr >= 0. && tr < trMin) {
                  trMin = tr;

                  vec3 Pr = Vr + tr * Wr;
                  vec3 Nr = hit2.xyz;

                  cr = uSA[k];

                  for (int j = 0 ; j < ` + NL + ` ; j++) {
                     vec3 L = uLG[j];
                     vec3 R = 2. * dot(Nr,L) * Nr - L;

                     cr += .8 * max(0.,dot(Nr,L)) * uSD[k] * uLC[j]
                         + pow(max(0.,dot(-Wr,R)),uSS[k].a) * uSS[k].rgb * uLC[j];
                  }
               }
            }

            c += .25 * cr;

            // Gamma correction

            fragColor = vec4(sqrt(c),1.);
         }
      }
   }`;

   let startTime = Date.now() / 1000;

   this.update = () => {

      let time = Date.now() / 1000 - startTime;
      setUniform('1f','uTime',time);

      // Cube data

      let CG = [];
      let SA = [];
      let SD = [];
      let SS = [];

      let radius = .5;

      for (let i = 0 ; i < NC ; i++) {
         let theta = 2 * Math.PI * i / NC + time / 10;

         CG.push(radius * Math.sin(2 * theta),
                 radius * Math.cos(theta),
                 -2.5 + .3 * Math.sin(theta), .25);

         let c = [
            .5 + .5 * Math.sin(2 * i),
            .5 + .5 * Math.sin(3 * i),
            .5 + .5 * Math.sin(4 * i),
         ];

         SA.push([.2 * c[0], .2 * c[1], .2 * c[2]]);
         SD.push(c);
         SS.push(1,1,1,50);
      }

      setUniform('4fv','uCG',CG.flat());
      setUniform('3fv','uSA',SA.flat());
      setUniform('3fv','uSD',SD.flat());
      setUniform('4fv','uSS',SS.flat());

      // Light directions

      let LG = [[2,1,1], [0,-1,0]];

      for (let j = 0 ; j < NL ; j++)
         LG[j] = normalize(LG[j]);

      setUniform('3fv','uLG',LG.flat());

      // Light colors

      let LC = [[.5,.75,1], [.5,.2,.1]];
      setUniform('3fv','uLC',LC.flat());
   }
}

gl_start(canvas, new Scene());

</script>
