<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidal Bloom — a noise garden</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, #132038 0%, #080e1c 54%, #050814 100%);
      color: #e7f9fa; font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 900px); padding: 28px 24px 36px; text-align: center; }
    .eyebrow { margin: 0 0 4px; color: #7cbcc7; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); font-weight: 300; letter-spacing: .13em; text-transform: uppercase; }
    .intro { margin: 2px 0 22px; color: #9db5c5; font-size: 14px; letter-spacing: .04em; }
    .frame { position: relative; width: min(100%, 720px); margin: auto; overflow: hidden;
      border: 1px solid #355267; border-radius: 16px;
      box-shadow: 0 25px 90px #0009, 0 0 45px #23adbd22; background: #07101e; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; touch-action: none; cursor: crosshair; }
    .hint { margin: 18px 0 0; color: #79a3b1; font-size: 13px; letter-spacing: .08em; }
    .hint strong { color: #9ce9df; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little world made of noise</p>
    <h1>Tidal Bloom</h1>
    <p class="intro">An ever-changing garden of light, currents, and color.</p>
    <div class="frame"><canvas id="canvas" width="720" height="720" aria-label="Animated glowing orb with flowing noise patterns"></canvas></div>
    <p class="hint"><strong>Move</strong> to stir the current &nbsp;·&nbsp; <strong>Press</strong> to make it glow</p>
  </main>
  <script src="webgl.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const cursor = [0, 0, 0];
    function moveCursor(event) {
      const rect = canvas.getBoundingClientRect();
      cursor[0] = (event.clientX - rect.left) / rect.width * 2 - 1;
      cursor[1] = 1 - (event.clientY - rect.top) / rect.height * 2;
    }
    canvas.addEventListener('pointermove', moveCursor);
    canvas.addEventListener('pointerdown', event => {
      moveCursor(event);
      cursor[2] = 1;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointerup', () => cursor[2] = 0);
    canvas.addEventListener('pointercancel', () => cursor[2] = 0);

    function Scene() {
      this.vertexShader = `#version 300 es
        in vec3 aPos;
        out vec2 vPos;
        void main() {
          vPos = aPos.xy;
          gl_Position = vec4(aPos, 1.);
        }`;

      this.fragmentShader = `#version 300 es
        precision highp float;
        uniform float uTime;
        uniform vec3 uCursor;
        in vec2 vPos;
        out vec4 fragColor;

        // Layering the supplied 3D noise makes broad currents and fine detail.
        float fbm(vec3 p) {
          float value = 0.;
          float amplitude = .5;
          for (int i = 0; i < 3; i++) {
            value += amplitude * noise(p);
            p = p * 2.03 + vec3(9.7, 3.1, 5.4);
            amplitude *= .5;
          }
          return value;
        }

        float hash21(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        void main() {
          vec2 p = vPos;
          float time = uTime;

          // Slow, cloudy water behind the bloom.
          float mist = noise(vec3(p * 2.4, time * .08));
          float mistFine = noise(vec3(p * 5.2 + 14., time * .12));
          vec3 color = mix(vec3(.012, .028, .065), vec3(.035, .105, .16),
                           clamp(.45 + mist * .7 + mistFine * .22, 0., 1.));
          color += .025 * vec3(.25, .7, 1.) * exp(-3. * dot(p, p));

          // A sparse field of tiny stars keeps the outer space alive.
          vec2 cell = floor((p + 1.) * 35.);
          vec2 spot = fract((p + 1.) * 35.) - .5;
          vec2 offset = vec2(hash21(cell), hash21(cell + 17.)) - .5;
          float star = step(.982, hash21(cell + 39.));
          float twinkle = .55 + .45 * sin(time * (1.4 + hash21(cell + 8.) * 2.) + hash21(cell + 5.) * 6.283);
          color += vec3(.35, .78, 1.) * star * twinkle *
                   (1. - smoothstep(.015, .06, length(spot - offset * .55)));

          vec2 q = p - vec2(0., .025);
          vec2 toCursor = q - uCursor.xy;
          float pull = exp(-5. * dot(toCursor, toCursor));
          q += .085 * pull * (1. + 1.7 * uCursor.z) * vec2(-toCursor.y, toCursor.x);
          float radius = length(q);

          // The cursor curls the noise coordinates like a finger in water.
          if (radius < .67) {
          vec3 sphere = vec3(q * 2.35, sqrt(max(0., .41 - dot(q, q))) * 2.5);
          float current = fbm(sphere * 2.1 + vec3(time * .16, -time * .10, time * .07));
          vec2 warp = vec2(current,
                           noise(sphere * 4.1 + vec3(11., time * .18, 3.)));
          vec3 flowPoint = sphere * 3.2 + vec3(warp * 1.3, time * .24);
          float ribbons = fbm(flowPoint);
          float wave = sin(23. * q.y + 11. * current + 5. * ribbons - time * .72);
          float veins = smoothstep(.27, .82, wave) * (.5 + .5 * smoothstep(-.18, .25, ribbons));

          vec3 deep = vec3(.035, .13, .27);
          vec3 teal = vec3(.02, .72, .71);
          vec3 violet = vec3(.43, .16, .73);
          vec3 coral = vec3(1., .34, .42);
          float blend = smoothstep(-.24, .32, current + .35 * ribbons);
          vec3 bloom = mix(deep, teal, blend);
          bloom = mix(bloom, violet, smoothstep(.09, .36, ribbons - current * .35) * .7);
          bloom += coral * veins * (.18 + .34 * smoothstep(.15, .58, radius));
          bloom += vec3(.16, .7, .8) * pow(max(0., wave), 12.) * .22;

          float dome = sqrt(max(0., 1. - radius * radius / (.64 * .64)));
          float lighting = .48 + .49 * dome + .19 * dot(normalize(vec3(q, dome)), normalize(vec3(-.5, .8, 1.)));
          bloom *= lighting;
          float mask = 1. - smoothstep(.615, .648, radius);
          color = mix(color, bloom, mask);
          }

          // A thin edge and broad aura make the object feel luminous.
          float rim = exp(-pow((radius - .642) / .012, 2.));
          float halo = exp(-pow(max(radius - .62, 0.) / .19, 2.));
          color += vec3(.06, .65, .8) * rim * .7;
          color += vec3(.02, .17, .25) * halo * .65;
          float orbit = exp(-pow((radius - .78) / .0025, 2.));
          color += vec3(.18, .63, .72) * orbit * .15;

          // Pressing lights a small pool under the pointer.
          float touch = exp(-18. * dot(p - uCursor.xy, p - uCursor.xy));
          color += uCursor.z * touch * vec3(.13, .48, .53);
          color *= 1. - .2 * smoothstep(.8, 1.35, length(p));
          fragColor = vec4(sqrt(max(color, vec3(0.))), 1.);
        }`;

      const started = performance.now();
      this.update = () => {
        setUniform('1f', 'uTime', (performance.now() - started) / 1000);
        setUniform('3fv', 'uCursor', cursor);
      };
    }

    gl_start(canvas, new Scene());
  </script>
</body>
</html>
