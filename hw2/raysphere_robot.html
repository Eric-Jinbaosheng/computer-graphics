<body bgcolor=#80a0ff>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

// Declare number of spheres and number of light sources

const NS = 80;
const NL = 2;

function Scene() {

   this.vertexShader = `#version 300 es
   in  vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;

   // All uniforms (data values are sent from CPU)

   uniform float uTime;
   uniform vec4 uS[` + NS + `];
   uniform vec3 uM[` + NS + `];
   uniform vec3 uL[` + NL + `];
   uniform vec3 uC[` + NL + `];

   in  vec3 vPos;
   out vec4 fragColor;

   // Focal length of the camera

   float fl = 3.;

   // A function to trace a ray to a sphere

   float raySphere(vec3 V, vec3 W, vec4 S) {
      V -= S.xyz;
      float r = S.w;
      float VW = dot(V, W);
      float VV = dot(V, V);
      float d = VW * VW - (VV - r*r);
      if (d < 0.)
         return -1.;
      return -VW - sqrt(d);
   }

   void main() {

      fragColor = vec4(.02,.025,.04,1.);

      // Define the ray from the eye to this pixel

      vec3 V = vec3(0.);
      vec3 W = normalize(vec3(vPos.xy, -fl));

      // Find the nearest sphere along the ray

      float tMin = 1000.;
      for (int i = 0 ; i < ` + NS + ` ; i++) {
         float t = raySphere(V, W, uS[i]);
         if (t >= 0. && t < tMin) {

            tMin = t;

            // Find the point on the sphere surface

            vec3 P = V + t * W;

            // Find the surface normal

            vec3 N = normalize(P - uS[i].xyz);

            // Do diffuse shading

            vec3 c = .15 * uM[i];
            for (int j = 0 ; j < ` + NL + ` ; j++)
               c += .85 * max(0., dot(N, uL[j])) * uC[j] * uM[i];

            // Do gamma color correction

            fragColor = vec4(sqrt(c), 1.);
         }
      }
   }`;

   let startTime = Date.now() / 1000;

   // Smoothly change from one value to another

   let mix = (a,b,t) => a + (b-a) * t;

   let smooth = t => {
      t = Math.max(0, Math.min(1, t));
      return t*t*(3-2*t);
   }

   let mixPose = (A,B,t) => {
      t = smooth(t);
      let Q = [];
      for (let i = 0 ; i < A.length ; i++)
         Q.push(mix(A[i], B[i], t));
      return Q;
   }

   // Compute the joint positions of the robot arm

   let robot = q => {

      let a = q[0];
      let b = q[1];
      let c = q[2];
      let d = q[3];
      let e = q[4];

      let A = [0,-.28,-2.6];

      let p1 = b;
      let p2 = b + c;
      let p3 = b + c + d;

      let V1 = [Math.sin(a)*Math.cos(p1), Math.sin(p1), -Math.cos(a)*Math.cos(p1)];
      let V2 = [Math.sin(a)*Math.cos(p2), Math.sin(p2), -Math.cos(a)*Math.cos(p2)];
      let V3 = [Math.sin(a)*Math.cos(p3), Math.sin(p3), -Math.cos(a)*Math.cos(p3)];

      let B = [A[0] + .55*V1[0], A[1] + .55*V1[1], A[2] + .55*V1[2]];
      let C = [B[0] + .48*V2[0], B[1] + .48*V2[1], B[2] + .48*V2[2]];
      let D = [C[0] + .22*V3[0], C[1] + .22*V3[1], C[2] + .22*V3[2]];
      let E = [D[0] + .14*V3[0], D[1] + .14*V3[1], D[2] + .14*V3[2]];

      // Side direction of the gripper, including wrist roll

      let X = [Math.cos(a), 0, Math.sin(a)];
      let Y = [-Math.sin(a)*Math.sin(p3), Math.cos(p3), Math.cos(a)*Math.sin(p3)];
      let Q = [Math.cos(e)*X[0] + Math.sin(e)*Y[0],
               Math.cos(e)*X[1] + Math.sin(e)*Y[1],
               Math.cos(e)*X[2] + Math.sin(e)*Y[2]];

      return { A:A, B:B, C:C, D:D, E:E, V:V3, Q:Q };
   }

   // Some useful robot poses

   let HOME     = [ 0.00, 1.00,-1.30,.50, 0.00];
   let PREPICK  = [ 0.55,  .45, -.75,.25, 0.10];
   let PICK     = [ 0.55,  .12, -.75,.35, 0.10];
   let LIFT     = [ 0.55,  .65, -.85,.25, 0.25];
   let TRANSFER = [-0.55,  .65, -.85,.25,-0.25];
   let PREPLACE = [-0.55,  .45, -.75,.25,-0.10];
   let PLACE    = [-0.55,  .12, -.75,.35,-0.10];

   let source = robot(PICK).E;
   let target = robot(PLACE).E;

   this.update = () => {

      // Send current time to fragment shader

      let time = Date.now() / 1000 - startTime;
      setUniform('1f', 'uTime', time);

      // Build sphere data and sphere color data

      let S = [];
      let M = [];

      let sphere = (x,y,z,r,c) => {
         S.push(x,y,z,r);
         M.push(c[0],c[1],c[2]);
      }

      // Make one robot link out of a row of spheres

      let link = (A,B,n,r1,r2,c) => {
         for (let i = 0 ; i <= n ; i++) {
            let t = i / n;
            sphere(mix(A[0],B[0],t),
                   mix(A[1],B[1],t),
                   mix(A[2],B[2],t),
                   mix(r1,r2,t), c);
         }
      }

      // Choose the current robot pose

      let t = time % 16;
      let q = HOME;
      let grip = .13;
      let holding = false;

      if (t < 2)
         q = mixPose(HOME, PREPICK, t/2);

      else if (t < 3)
         q = mixPose(PREPICK, PICK, t-2);

      else if (t < 4) {
         q = PICK;
         grip = mix(.13,.07,smooth(t-3));
      }

      else if (t < 5.5) {
         q = mixPose(PICK, LIFT, (t-4)/1.5);
         grip = .07;
         holding = true;
      }

      else if (t < 8) {
         q = mixPose(LIFT, TRANSFER, (t-5.5)/2.5);
         grip = .07;
         holding = true;
      }

      else if (t < 9) {
         q = mixPose(TRANSFER, PREPLACE, t-8);
         grip = .07;
         holding = true;
      }

      else if (t < 10) {
         q = mixPose(PREPLACE, PLACE, t-9);
         grip = .07;
         holding = true;
      }

      else if (t < 11) {
         q = PLACE;
         grip = mix(.07,.13,smooth(t-10));
      }

      else if (t < 14)
         q = mixPose(PLACE, HOME, (t-11)/3);

      else
         q = HOME;

      let R = robot(q);

      // Colors

      let gray   = [.70,.74,.80];
      let dark   = [.18,.20,.24];
      let orange = [1.00,.38,.06];
      let cyan   = [.05,.70,1.00];
      let green  = [.10,1.00,.30];

      // Robot base

      sphere(0,-.78,-2.6,.28,dark);
      sphere(0,-.60,-2.6,.23,gray);
      sphere(0,-.42,-2.6,.18,dark);

      for (let i = 0 ; i < 6 ; i++) {
         let a = q[0] + 2*Math.PI*i/6;
         sphere(.18*Math.cos(a),-.57,-2.6+.18*Math.sin(a),.035,orange);
      }

      // Upper arm

      link(R.A,R.B,7,.105,.085,gray);
      sphere(R.B[0],R.B[1],R.B[2],.13,dark);
      sphere(R.B[0],R.B[1],R.B[2],.075,orange);

      // Forearm

      link(R.B,R.C,7,.085,.065,gray);
      sphere(R.C[0],R.C[1],R.C[2],.11,dark);
      sphere(R.C[0],R.C[1],R.C[2],.065,orange);

      // Wrist

      link(R.C,R.D,3,.065,.050,gray);
      sphere(R.D[0],R.D[1],R.D[2],.085,dark);
      sphere(R.D[0],R.D[1],R.D[2],.045,orange);

      // Gripper palm

      for (let i = -2 ; i <= 2 ; i++)
         sphere(R.D[0] + .045*i*R.Q[0],
                R.D[1] + .045*i*R.Q[1],
                R.D[2] + .045*i*R.Q[2], .04, dark);

      // Two gripper fingers

      let L = [R.D[0] + grip*R.Q[0],
               R.D[1] + grip*R.Q[1],
               R.D[2] + grip*R.Q[2]];

      let G = [R.D[0] - grip*R.Q[0],
               R.D[1] - grip*R.Q[1],
               R.D[2] - grip*R.Q[2]];

      let LT = [L[0] + .20*R.V[0], L[1] + .20*R.V[1], L[2] + .20*R.V[2]];
      let GT = [G[0] + .20*R.V[0], G[1] + .20*R.V[1], G[2] + .20*R.V[2]];

      link(L,LT,4,.032,.026,dark);
      link(G,GT,4,.032,.026,dark);
      sphere(LT[0],LT[1],LT[2],.033,orange);
      sphere(GT[0],GT[1],GT[2],.033,orange);

      // Draw the pickup and place targets

      for (let i = 0 ; i < 8 ; i++) {
         let a = 2*Math.PI*i/8;
         sphere(source[0]+.15*Math.cos(a), source[1]-.08, source[2]+.15*Math.sin(a),
                .022 + .004*Math.sin(3*time+i), cyan);
         sphere(target[0]+.15*Math.cos(a), target[1]-.08, target[2]+.15*Math.sin(a),
                .022 + .004*Math.sin(3*time+i+2), green);
      }

      // The sphere being moved by the robot

      let P = source;
      let color = cyan;

      if (holding) {
         P = R.E;
         color = orange;
      }
      else if (t >= 10 && t < 14) {
         P = target;
         color = green;
      }

      sphere(P[0],P[1],P[2],.075,color);

      // Fill unused sphere slots

      while (S.length / 4 < NS) {
         S.push(0,0,10,.001);
         M.push(0,0,0);
      }

      setUniform('4fv', 'uS', S);
      setUniform('3fv', 'uM', M);

      // Send light source directions to fragment shader

      let Ls = [2,1,1, -1,.5,1];

      // Normalize light source direction vectors

      for (let j = 0 ; j < NL ; j++) {
         let x = Ls[3*j], y = Ls[3*j+1], z = Ls[3*j+2];
         let r = Math.sqrt(x*x + y*y + z*z);
         Ls[3*j  ] = x/r;
         Ls[3*j+1] = y/r;
         Ls[3*j+2] = z/r;
      }
      setUniform('3fv', 'uL', Ls);

      // Send light source colors to fragment shader

      setUniform('3fv', 'uC', [.8,.9,1., .4,.25,.15]);
   }
}

gl_start(canvas, new Scene());
</script>
